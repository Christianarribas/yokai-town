<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- viewport: imprescindible para que se vea bien en el móvil -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yokai Town</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ============================================
       1. CABECERA: título, botón de avance rápido y reloj
       ============================================ -->
  <header id="cabecera">
    <h1>🏮 Yokai Town</h1>
    <div id="zona-reloj">
      <!-- El botón ⏩ hace correr el reloj para ver el día entero -->
      <button id="boton-avance" title="Ver el día entero rápido">⏩</button>
      <div id="reloj">
        <span id="icono-tiempo">☀️</span>
        <span id="hora">--:--</span>
      </div>
    </div>
  </header>

  <!-- ============================================
       2. MAPA DEL PUEBLO
       Las casas, los caminos y los personajes
       los crea app.js (así es más fácil cambiarlos)
       ============================================ -->
  <main id="mapa">
    <!-- Capa oscura que sube y baja para hacer la noche -->
    <div id="filtro-noche"></div>
  </main>

  <!-- ============================================
       3. CARTELITO DE AVISOS
       Sale cuando Tanuki recoge o entrega un aviso
       ============================================ -->
  <div id="aviso" class="oculta"></div>

  <!-- ============================================
       4. FICHA DEL PERSONAJE
       Se muestra al tocar un personaje
       ============================================ -->
  <aside id="ficha" class="oculta">
    <button id="cerrar-ficha" aria-label="Cerrar">✖</button>
    <div id="ficha-emoji">🍃</div>
    <h2 id="ficha-nombre">Nombre</h2>
    <p id="ficha-oficio">Papel</p>
    <p id="ficha-estado">Qué está haciendo</p>
  </aside>

  <!-- 5. Pista para el jugador -->
  <p id="ayuda">👆 Toca un vecino para ver su ficha</p>

  <script src="app.js"></script>
</body>
</html>
